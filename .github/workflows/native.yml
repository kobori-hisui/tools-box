name: Native
on:
  push:
    paths: ['native/**', 'protocol/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'protocol/**']

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/rust }
      - run: cargo fmt --all --check
        working-directory: native/rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: native/rust
      - run: cargo test --workspace
        working-directory: native/rust
      - run: cargo build --release -p toolbox-sidecar
        working-directory: native/rust
      - run: rustup target add wasm32-unknown-unknown && cargo build --profile wasm -p toolbox-wasm --target wasm32-unknown-unknown
        working-directory: native/rust

  go:
    needs: rust # the integration test uses the real sidecar binary
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version-file: native/go/go.mod }
      - run: cargo build --release -p toolbox-sidecar
        working-directory: native/rust
      - run: go vet ./...
        working-directory: native/go
      - run: go test -race -count=1 ./...
        working-directory: native/go
