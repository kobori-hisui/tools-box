[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/wasm", "crates/sidecar", "crates/drivers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tamaño minimo para el .wasm (usa: cargo build --profile wasm -p toolbox-wasm --target wasm32-unknown-unknown)
[profile.wasm]
inherits = "release"
opt-level = "z"
